name: Style

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  clang-format:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Locate clang-format
        shell: pwsh
        run: |
          # runner 是 x64，排除 ARM/ARM64 的 LLVM 工具（否则 ARM64 版 clang-format 无法在 x64 上启动）
          $clangFormat = Get-ChildItem "C:\Program Files\Microsoft Visual Studio" -Recurse -Filter clang-format.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -notmatch '\\ARM64\\|\\ARM\\' } |
            Sort-Object { if ($_.FullName -match '\\x64\\|Hostx64') { 0 } else { 1 } } |
            Select-Object -First 1
          if (-not $clangFormat) {
            Write-Error "clang-format not found"
            exit 1
          }
          echo "CLANG_FORMAT=$($clangFormat.FullName)" >> $env:GITHUB_ENV

      - name: Check formatting
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path inc, src, tests -Recurse -Include *.h, *.cpp -ErrorAction SilentlyContinue
          $failed = $false
          foreach ($f in $files) {
            & $env:CLANG_FORMAT --dry-run --Werror $f.FullName
            if ($LASTEXITCODE -ne 0) { $failed = $true }
          }
          if ($failed) { exit 1 }