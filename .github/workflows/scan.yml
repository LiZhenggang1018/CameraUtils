name: Scheduled Bug Scan

on:
  schedule:
    - cron: '0 18 */2 * *'
  workflow_dispatch: {}

concurrency:
  group: scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  static-analysis:
    name: Static analysis (clang-tidy)
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Set up MSVC environment
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64

      - name: Cache CPM packages
        uses: actions/cache@v5
        with:
          path: ~/.cpm-cache
          key: ${{ runner.os }}-cpm-${{ hashFiles('**/CMakePresets.json', '**/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-cpm-

      - name: Set up OpenCV with contrib
        uses: ./.github/actions/setup-opencv
        with:
          version: "4.10.0"
          config: "Release"

      - name: Run static analysis
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts/scan-bugs.ps1 -Step static

  asan:
    name: ASan
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - name: Set up MSVC environment
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64

      - name: Cache CPM packages
        uses: actions/cache@v5
        with:
          path: ~/.cpm-cache
          key: ${{ runner.os }}-cpm-${{ hashFiles('**/CMakePresets.json', '**/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-cpm-

      - name: Set up OpenCV with contrib
        uses: ./.github/actions/setup-opencv
        with:
          version: "4.10.0"
          config: "Debug"

      - name: Run ASan scan
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts/scan-bugs.ps1 -Step asan

  hardened:
    name: Hardened (/guard:cf + /sdl)
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - name: Set up MSVC environment
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64

      - name: Cache CPM packages
        uses: actions/cache@v5
        with:
          path: ~/.cpm-cache
          key: ${{ runner.os }}-cpm-${{ hashFiles('**/CMakePresets.json', '**/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-cpm-

      - name: Set up OpenCV with contrib
        uses: ./.github/actions/setup-opencv
        with:
          version: "4.10.0"
          config: "Release"

      - name: Run hardened scan
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts/scan-bugs.ps1 -Step hardened
