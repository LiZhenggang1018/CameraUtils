name: CI

on:
  #push:
  #  branches: [ main ]
  #pull_request:
  #  branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build

      - name: Build
        run: cmake --build build --config Release

      - name: Test (unit)
        run: ctest --test-dir build -C Release -L unit --output-on-failure

      - name: Test (media, skip if no assets)
        run: ctest --test-dir build -C Release -L media --output-on-failure
        continue-on-error: true
