name: Windows CI (VS2022 x64 Debug)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "要构建的分支/标签/提交 SHA（留空则用当前默认分支）"
        required: false
        default: ""
      build_target:
        description: "构建目标（默认 CameraUtils）"
        required: false
        default: "CameraUtils"

  schedule:
    - cron: '0 11 */3 * *'

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up MSVC environment
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64

      - name: Cache CPM packages
        uses: actions/cache@v5
        with:
          path: ~/.cpm-cache
          key: ${{ runner.os }}-cpm-${{ hashFiles('**/CMakePresets.json', '**/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-cpm-

      # 👇 OpenCV 三步：缓存 + 首次下载解压 + 设置 OPENCV_ROOT
      - name: Cache OpenCV
        id: opencv-cache
        uses: actions/cache@v5
        with:
          path: C:\opencv
          key: opencv-4.10.0-windows-x64

      - name: Download and extract OpenCV
        if: steps.opencv-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $url = "https://github.com/opencv/opencv/releases/download/4.10.0/opencv-4.10.0-windows.exe"
          $installer = "$env:RUNNER_TEMP\opencv-installer.exe"
          Write-Host "Downloading $url ..."
          Invoke-WebRequest -Uri $url -OutFile $installer
          Write-Host "Extracting to C:\opencv ..."
          New-Item -ItemType Directory -Force -Path "C:\opencv" | Out-Null
          Start-Process -FilePath $installer -ArgumentList "-o`"C:\opencv`" -y" -Wait -NoNewWindow
          Write-Host "Extracted directory tree:"
          Get-ChildItem "C:\opencv" -Depth 2 | Select-Object FullName

      - name: Set OPENCV_ROOT
        shell: pwsh
        run: |
          $candidates = @(
            "C:\opencv\opencv\build",
            "C:\opencv\build",
            "C:\opencv\opencv"
          )
          $found = $null
          foreach ($c in $candidates) {
            if (Test-Path (Join-Path $c "OpenCVConfig.cmake")) {
              $found = $c
              break
            }
          }
          if (-not $found) {
            $cfg = Get-ChildItem -Path "C:\opencv" -Recurse -Filter "OpenCVConfig.cmake" |
                   Select-Object -First 1
            if ($cfg) { $found = $cfg.DirectoryName }
          }
          if (-not $found) {
            Write-Error "OpenCVConfig.cmake not found under C:\opencv"
            exit 1
          }
          Write-Host "OPENCV_ROOT=$found"
          echo "OPENCV_ROOT=$found" >> $env:GITHUB_ENV

      - name: Configure CMake (x64-debug)
        run: cmake --preset x64-debug

      - name: Build
        run: cmake --build --preset x64-debug --target ${{ inputs.build_target || 'CameraUtils' }}