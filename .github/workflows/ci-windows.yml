name: Windows CI (VS2022 x64 Debug)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "要构建的分支/标签/提交 SHA（留空则用当前默认分支）"
        required: false
        default: ""
      build_target:
        description: "构建目标（默认 CameraUtils）"
        required: false
        default: "CameraUtils"

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up MSVC environment
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64

      - name: Cache CPM packages
        uses: actions/cache@v5
        with:
          path: ~/.cpm-cache
          key: ${{ runner.os }}-cpm-${{ hashFiles('**/CMakePresets.json', '**/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-cpm-

      - name: Configure CMake (x64-debug)
        run: cmake --preset x64-debug

      - name: Build
        run: cmake --build --preset x64-debug --target ${{ inputs.build_target }}