name: Windows CI (VS2022 x64 Debug)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "要构建的分支/标签/提交 SHA（留空则用当前默认分支）"
        required: false
        default: ""
      build_target:
        description: "构建目标（默认 camera_utils_tests）"
        required: false
        default: "camera_utils_tests"

  schedule:
    - cron: '0 11 */3 * *'

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up MSVC environment
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64

      - name: Cache CPM packages
        uses: actions/cache@v5
        with:
          path: ~/.cpm-cache
          key: ${{ runner.os }}-cpm-${{ hashFiles('**/CMakePresets.json', '**/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-cpm-

      # OpenCV 必须含 contrib（optflow / ximgproc），官方 windows 安装包不含 contrib，
      # 用它会被 CMakeLists.txt 的 optflow.hpp 判定拒掉并退化为源码构建。
      - name: Set up OpenCV with contrib
        id: opencv
        uses: ./.github/actions/setup-opencv
        with:
          version: "4.10.0"
          config: "Debug"

      - name: Configure CMake (x64-debug)
        shell: pwsh
        run: |
          # preset 硬编码的是本机绝对编译器路径（14.52），CI runner 上不存在。
          # 用 setup-msvc-dev 的 VCToolsInstallDir 推导 runner 的 cl.exe 覆盖。
          $cl = (Join-Path $env:VCToolsInstallDir 'bin\Hostx64\x64\cl.exe') -replace '\\', '/'
          cmake --preset x64-debug "-DCMAKE_CXX_COMPILER=$cl" "-DCMAKE_C_COMPILER=$cl"

      - name: Build
        run: cmake --build --preset x64-debug --target ${{ inputs.build_target || 'camera_utils_tests' }}

      - name: Test (unit)
        run: ctest --test-dir out/build/x64-debug -C Debug -L unit --output-on-failure
