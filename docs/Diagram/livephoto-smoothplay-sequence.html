<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LivePhotoSmoothPlay · Sequence</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-soft:    #5a6580;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em;
      text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400;
      letter-spacing: -0.02em; line-height: 1.15; color: var(--color-ink); margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 820px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Sequence · Diagram Design</p>
    <h1>LivePhotoSmoothPlay call sequence</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 820 660" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="lp-seq-title lp-seq-desc">
        <title id="lp-seq-title">LivePhotoSmoothPlay call sequence</title>
        <desc id="lp-seq-desc">Sequence diagram of the five synchronous calls from the test entry point through the orchestration function into the smoothing pipeline: decode, register, generate FOV frames, replace, and verify.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- ===== Lifelines (dashed vertical) ===== -->
        <line x1="150" y1="140" x2="150" y2="620" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="410" y1="140" x2="410" y2="620" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="670" y1="140" x2="670" y2="620" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

        <!-- ===== Actors (boxes at top) ===== -->
        <rect x="90" y="60" width="120" height="60" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.25)" stroke-width="1"/>
        <rect x="98" y="68" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="114" y="77" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TST</text>
        <text x="150" y="96" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">LpFovTest</text>

        <rect x="350" y="60" width="120" height="60" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <rect x="358" y="68" width="32" height="12" rx="2" fill="transparent" stroke="rgba(191,69,32,0.50)" stroke-width="0.8"/>
        <text x="374" y="77" fill="#bf4520" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ORC</text>
        <text x="410" y="96" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">GenFromLpToOptLp</text>

        <rect x="610" y="60" width="120" height="60" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.25)" stroke-width="1"/>
        <rect x="618" y="68" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="634" y="77" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ALG</text>
        <text x="670" y="96" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Core pipeline</text>

        <!-- ===== Activation bars ===== -->
        <!-- Test actor: full duration -->
        <rect x="146" y="130" width="8" height="480" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
        <!-- Orchestrator: active throughout -->
        <rect x="406" y="130" width="8" height="480" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
        <!-- Core pipeline: active per call -->
        <rect x="666" y="150" width="8" height="28" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
        <rect x="666" y="230" width="8" height="28" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
        <rect x="666" y="310" width="8" height="28" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
        <rect x="666" y="390" width="8" height="28" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
        <rect x="666" y="470" width="8" height="28" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>

        <!-- ===== Messages (top -> down) ===== -->
        <!-- 1. Test -> Orchestrator: GenFromLpToOptLp (accent headline) -->
        <line x1="154" y1="140" x2="402" y2="140" stroke="#bf4520" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
        <rect x="196" y="128" width="164" height="12" rx="2" fill="#f5f5f5"/>
        <text x="278" y="138" fill="#bf4520" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">GenFromLpToOptLp</text>

        <!-- 2. Orchestrator -> Core: DecodeLpMp4ToYuvs -->
        <line x1="414" y1="164" x2="662" y2="164" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
        <rect x="440" y="152" width="150" height="12" rx="2" fill="#f5f5f5"/>
        <text x="515" y="162" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">DecodeLpMp4ToYuvs</text>
        <!-- return -->
        <line x1="662" y1="184" x2="414" y2="184" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
        <rect x="440" y="186" width="88" height="12" rx="2" fill="#f5f5f5"/>
        <text x="484" y="196" fill="#5a6580" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">LpJpg/*.yuv</text>

        <!-- 3. Orchestrator -> Core: RegCoverToVid -->
        <line x1="414" y1="244" x2="662" y2="244" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
        <rect x="452" y="232" width="126" height="12" rx="2" fill="#f5f5f5"/>
        <text x="515" y="242" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">RegCoverToVid</text>
        <!-- return -->
        <line x1="662" y1="264" x2="414" y2="264" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
        <rect x="440" y="266" width="130" height="12" rx="2" fill="#f5f5f5"/>
        <text x="505" y="276" fill="#5a6580" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">scaleRatio.txt</text>

        <!-- 4. Orchestrator -> Core: GenDiffFovYuvs -->
        <line x1="414" y1="324" x2="662" y2="324" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
        <rect x="446" y="312" width="138" height="12" rx="2" fill="#f5f5f5"/>
        <text x="515" y="322" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">GenDiffFovYuvs</text>
        <!-- return -->
        <line x1="662" y1="344" x2="414" y2="344" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
        <rect x="440" y="346" width="120" height="12" rx="2" fill="#f5f5f5"/>
        <text x="500" y="356" fill="#5a6580" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">crop1..20.yuv</text>

        <!-- 5. Orchestrator -> Core: ReplaceAlphaMerge -->
        <line x1="414" y1="404" x2="662" y2="404" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
        <rect x="440" y="392" width="150" height="12" rx="2" fill="#f5f5f5"/>
        <text x="515" y="402" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">ReplaceAlphaMerge</text>
        <!-- return -->
        <line x1="662" y1="424" x2="414" y2="424" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
        <rect x="440" y="426" width="96" height="12" rx="2" fill="#f5f5f5"/>
        <text x="488" y="436" fill="#5a6580" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">LpOpt.mp4</text>

        <!-- 6. Orchestrator -> Core: DecodeOptLpMp4ToYuvs -->
        <line x1="414" y1="484" x2="662" y2="484" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
        <rect x="440" y="472" width="150" height="12" rx="2" fill="#f5f5f5"/>
        <text x="515" y="482" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">DecodeOptLpMp4</text>
        <!-- return -->
        <line x1="662" y1="504" x2="414" y2="504" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
        <rect x="440" y="506" width="108" height="12" rx="2" fill="#f5f5f5"/>
        <text x="494" y="516" fill="#5a6580" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">LpOptJpg/*.yuv</text>

        <!-- 7. Orchestrator -> Test: return (headline success, coral) -->
        <line x1="402" y1="560" x2="154" y2="560" stroke="#bf4520" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow-accent)"/>
        <rect x="196" y="548" width="118" height="12" rx="2" fill="#f5f5f5"/>
        <text x="255" y="558" fill="#bf4520" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">optimized</text>

        <!-- ===== Legend ===== -->
        <line x1="90" y1="600" x2="730" y2="600" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="90" y="618" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
        <line x1="160" y1="614" x2="184" y2="614" stroke="#bf4520" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
        <text x="192" y="617" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Headline call / success</text>
        <line x1="360" y1="614" x2="384" y2="614" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
        <text x="392" y="617" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Sync call</text>
        <line x1="496" y1="614" x2="520" y2="614" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
        <text x="528" y="617" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Return (dashed)</text>
      </svg>
    </div>
  </div>
</body>
</html>
