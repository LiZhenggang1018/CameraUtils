<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HdrMerge · Sequence</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-soft:    #5a6580;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink);
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em;
      text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400;
      letter-spacing: -0.02em; line-height: 1.15; color: var(--color-ink); margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 820px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Sequence · Diagram Design</p>
    <h1>HDR merge call sequence</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 820 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="hdr-seq-title hdr-seq-desc">
        <title id="hdr-seq-title">HDR merge call sequence</title>
        <desc id="hdr-seq-desc">Sequence diagram of the HDR merge orchestration: align the bracketed images, crop a common ROI, branch into Mertens or physical Debevec fusion with ghost suppression, sharpen, and write output.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
        </defs>
        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <line x1="150" y1="140" x2="150" y2="600" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="410" y1="140" x2="410" y2="600" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="670" y1="140" x2="670" y2="600" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

        <rect x="90" y="60" width="120" height="60" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.25)" stroke-width="1"/>
        <rect x="98" y="68" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="114" y="77" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TST</text>
        <text x="150" y="96" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">RunHdrMergeTest</text>

        <rect x="350" y="60" width="120" height="60" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <rect x="358" y="68" width="32" height="12" rx="2" fill="transparent" stroke="rgba(191,69,32,0.50)" stroke-width="0.8"/>
        <text x="374" y="77" fill="#bf4520" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ORC</text>
        <text x="410" y="96" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">HdrMergeFromFiles</text>

        <rect x="610" y="60" width="120" height="60" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.25)" stroke-width="1"/>
        <rect x="618" y="68" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="634" y="77" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ALG</text>
        <text x="670" y="96" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Algorithms</text>

        <rect x="146" y="130" width="8" height="460" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
        <rect x="406" y="130" width="8" height="460" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
        <rect x="666" y="150" width="8" height="24" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
        <rect x="666" y="210" width="8" height="24" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
        <rect x="666" y="340" width="8" height="24" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
        <rect x="666" y="440" width="8" height="24" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>

        <!-- 1. entry -->
        <line x1="154" y1="140" x2="402" y2="140" stroke="#bf4520" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
        <rect x="196" y="128" width="140" height="12" rx="2" fill="#f5f5f5"/>
        <text x="266" y="138" fill="#bf4520" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">HdrMergeFromFiles</text>

        <!-- 2. AlignToReference -->
        <line x1="414" y1="160" x2="662" y2="160" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
        <rect x="440" y="148" width="116" height="12" rx="2" fill="#f5f5f5"/>
        <text x="498" y="158" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">AlignToReference</text>
        <line x1="662" y1="178" x2="414" y2="178" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
        <rect x="440" y="180" width="92" height="12" rx="2" fill="#f5f5f5"/>
        <text x="486" y="190" fill="#5a6580" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.03em">aligned ×2</text>

        <!-- 3. ComputeCommonRoi -->
        <line x1="414" y1="220" x2="662" y2="220" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
        <rect x="440" y="208" width="128" height="12" rx="2" fill="#f5f5f5"/>
        <text x="504" y="218" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">ComputeCommonRoi</text>
        <line x1="662" y1="238" x2="414" y2="238" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

        <!-- alt fragment: pipeline branch -->
        <rect x="300" y="280" width="470" height="130" rx="4" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
        <rect x="300" y="280" width="40" height="16" rx="2" fill="#f5f5f5" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
        <text x="320" y="292" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">ALT</text>
        <text x="350" y="293" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.04em">[pipelineMode]</text>

        <!-- region 1: mertens -->
        <text x="312" y="316" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.04em">[mertens]</text>
        <line x1="414" y1="330" x2="662" y2="330" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
        <rect x="446" y="318" width="104" height="12" rx="2" fill="#f5f5f5"/>
        <text x="498" y="328" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">MergeMertens</text>
        <line x1="662" y1="348" x2="414" y2="348" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

        <!-- divider -->
        <line x1="308" y1="360" x2="762" y2="360" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>

        <!-- region 2: physical -->
        <text x="312" y="376" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.04em">[physical]</text>
        <line x1="414" y1="390" x2="662" y2="390" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
        <rect x="446" y="378" width="104" height="12" rx="2" fill="#f5f5f5"/>
        <text x="498" y="388" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">MergeDebevec</text>
        <line x1="662" y1="408" x2="414" y2="408" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

        <!-- 4. UnsharpMask (after fragment) -->
        <line x1="414" y1="450" x2="662" y2="450" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
        <rect x="440" y="438" width="100" height="12" rx="2" fill="#f5f5f5"/>
        <text x="490" y="448" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">UnsharpMask</text>
        <line x1="662" y1="468" x2="414" y2="468" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

        <!-- 5. return -->
        <line x1="402" y1="540" x2="154" y2="540" stroke="#bf4520" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow-accent)"/>
        <rect x="196" y="528" width="118" height="12" rx="2" fill="#f5f5f5"/>
        <text x="255" y="538" fill="#bf4520" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">hdr_merged.jpg</text>

        <line x1="90" y1="580" x2="730" y2="580" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="90" y="598" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
        <line x1="160" y1="594" x2="184" y2="594" stroke="#bf4520" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
        <text x="192" y="597" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Headline call / success</text>
        <line x1="360" y1="594" x2="384" y2="594" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
        <text x="392" y="597" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Sync call</text>
        <line x1="496" y1="594" x2="520" y2="594" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
        <text x="528" y="597" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Return</text>
      </svg>
    </div>
  </div>
</body>
</html>
