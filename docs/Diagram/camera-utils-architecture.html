<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CameraUtils · Architecture</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Diagram Design</p>
    <h1>CameraUtils module map</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 960 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="camera-utils-arch-title camera-utils-arch-desc">
        <title id="camera-utils-arch-title">CameraUtils module map</title>
        <desc id="camera-utils-arch-desc">Architecture diagram showing the CameraUtils CLI and test runners sharing a command registry over a static core library that holds common utilities and nine algorithm chapters.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Zone 1: ENTRY -->
        <rect x="40" y="56" width="880" height="152" rx="8"
              fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="56" y="60" width="52" height="12" rx="2" fill="#f5f5f5"/>
        <text x="82" y="69" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace"
              text-anchor="middle" letter-spacing="0.14em">ENTRY</text>

        <!-- Zone 2: CORE -->
        <rect x="40" y="232" width="880" height="152" rx="8"
              fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="56" y="236" width="44" height="12" rx="2" fill="#f5f5f5"/>
        <text x="78" y="245" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace"
              text-anchor="middle" letter-spacing="0.14em">CORE</text>

        <!-- Zone 3: MODULES -->
        <rect x="40" y="408" width="880" height="176" rx="8"
              fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="56" y="412" width="60" height="12" rx="2" fill="#f5f5f5"/>
        <text x="86" y="421" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace"
              text-anchor="middle" letter-spacing="0.14em">MODULES</text>

        <!-- ================= Arrows (drawn before boxes) ================= -->

        <!-- ENTRY -> CommandTable (both exe converge on the shared registry) -->
        <path d="M 192,196 V 220 H 384 Q 392,220 392,212 V 276"
              fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 768,196 V 220 H 576 Q 568,220 568,212 V 276"
              fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- CommandTable -> core (accent, headline path) -->
        <line x1="480" y1="320" x2="480" y2="360" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

        <!-- core -> CommonUtils + algorithm chapters (fan out from core bottom edge) -->
        <path d="M 400,412 V 424 H 240 Q 232,424 232,432 V 448"
              fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 480,412 V 448"
              fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 560,412 V 424 H 720 Q 728,424 728,432 V 448"
              fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- chapters -> third-party deps (external, dashed) -->
        <path d="M 240,532 V 556" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
        <path d="M 480,532 V 556" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
        <path d="M 720,532 V 556" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

        <!-- Arrow labels -->
        <rect x="252" y="202" width="60" height="12" rx="2" fill="#f5f5f5"/>
        <text x="282" y="211" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">REGISTER</text>
        <rect x="648" y="202" width="60" height="12" rx="2" fill="#f5f5f5"/>
        <text x="678" y="211" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">REGISTER</text>

        <!-- ================= Nodes ================= -->

        <!-- ENTRY: CameraUtils (exe) -->
        <rect x="112" y="132" width="160" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="112" y="132" width="160" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="120" y="140" width="36" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="138" y="149" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXE</text>
        <text x="192" y="168" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">CameraUtils</text>
        <text x="192" y="184" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">src/main.cpp</text>

        <!-- ENTRY: camera_utils_tests (exe) -->
        <rect x="688" y="132" width="160" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="688" y="132" width="160" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="696" y="140" width="36" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="714" y="149" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXE</text>
        <text x="768" y="168" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">camera_utils_tests</text>
        <text x="768" y="184" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">tests/TestMain.cpp</text>

        <!-- CORE: CommandTable.h (shared registry, store) -->
        <rect x="400" y="268" width="160" height="52" rx="6" fill="#f5f5f5"/>
        <rect x="400" y="268" width="160" height="52" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <rect x="408" y="274" width="36" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
        <text x="426" y="283" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TBL</text>
        <text x="480" y="300" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">CommandTable.h</text>
        <text x="480" y="314" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">command registry</text>

        <!-- CORE: camera_utils_core (focal coral) -->
        <rect x="368" y="360" width="224" height="52" rx="6" fill="#f5f5f5"/>
        <rect x="368" y="360" width="224" height="52" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <rect x="376" y="366" width="36" height="12" rx="2" fill="transparent" stroke="rgba(191,69,32,0.50)" stroke-width="0.8"/>
        <text x="394" y="375" fill="#bf4520" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LIB</text>
        <text x="480" y="392" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">camera_utils_core</text>
        <text x="480" y="406" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">static lib · C++20</text>

        <!-- MODULES: CommonUtils (shared infra) -->
        <rect x="140" y="448" width="200" height="84" rx="6" fill="#f5f5f5"/>
        <rect x="140" y="448" width="200" height="84" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <rect x="148" y="454" width="40" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
        <text x="168" y="463" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">UTIL</text>
        <text x="240" y="486" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">CommonUtils</text>
        <text x="240" y="502" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">ThreadPool · Event · JSON</text>
        <text x="240" y="516" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">OpenCV/FFmpeg/exiv2</text>

        <!-- MODULES: Algorithm chapters (header-only) -->
        <rect x="372" y="448" width="216" height="84" rx="6" fill="#f5f5f5"/>
        <rect x="372" y="448" width="216" height="84" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="380" y="454" width="40" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="400" y="463" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ALG</text>
        <text x="480" y="486" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Algorithm chapters</text>
        <text x="480" y="502" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">ImageProcessing · Alignment</text>
        <text x="480" y="516" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">SfM · Depth · CompPhoto</text>

        <!-- MODULES: Mixed chapters (inc + src .cpp) -->
        <rect x="620" y="448" width="216" height="84" rx="6" fill="#f5f5f5"/>
        <rect x="620" y="448" width="216" height="84" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="628" y="454" width="40" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="648" y="463" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CPP</text>
        <text x="728" y="486" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Mixed chapters</text>
        <text x="728" y="502" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">FeatureMatching · OpticalFlow</text>
        <text x="728" y="516" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">LivePhotoDecode · SmoothPlay</text>

        <!-- Third-party deps (external band) -->
        <rect x="140" y="556" width="696" height="40" rx="6" fill="#f5f5f5"/>
        <rect x="140" y="556" width="696" height="40" rx="6" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <text x="488" y="580" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">OpenCV · FFmpeg · exiv2 · nlohmann_json · magic_enum</text>

        <!-- Legend strip -->
        <line x1="40" y1="616" x2="920" y2="616" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="40" y="632" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>
        <rect x="140" y="624" width="14" height="10" rx="2" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="160" y="632" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Focal (core lib)</text>
        <rect x="280" y="624" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="300" y="632" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Executable / backend</text>
        <rect x="460" y="624" width="14" height="10" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text x="480" y="632" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Registry / store</text>
        <rect x="620" y="624" width="14" height="10" rx="2" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <text x="640" y="632" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">External / deps</text>
      </svg>
    </div>
  </div>
</body>
</html>
